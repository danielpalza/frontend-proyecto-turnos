server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta archivos de hasta 20 MB (spring.servlet.multipart).
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    # Cabeceras basicas de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # API: mismo origen que el front => cero CORS y el backend nunca queda
    # expuesto a internet. El resolver 127.0.0.11 es el DNS interno de Docker;
    # usar una variable difiere la resolucion, asi nginx arranca aunque el
    # backend todavia no este listo (si no, nginx muere al iniciar).
    # -------------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
        proxy_buffering       off;
    }

    # Assets con hash en el nombre: cachear fuerte.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # El index NO se cachea: es lo que apunta a los assets nuevos tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Rutas de Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
