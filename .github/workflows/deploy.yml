name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # danielpalza/frontend-proyecto-turnos

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm run test:coverage

      - name: Build produccion
        run: npm run build

      # El driver 'docker' por defecto no soporta exportar cache. Este crea un
      # builder con driver docker-container, que si lo soporta.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mantiene el paquete privado bajo los 500 MB gratis del plan Free.
      #
      # delete-only-untagged-versions: true es OBLIGATORIO. En false esta accion borra
      # tambien versiones ETIQUETADAS, y como cada push publica varias (el manifest de la
      # imagen, el indice multi-arch y los attestations que agrega build-push-action@v6),
      # un tope bajo termina borrando contenido que el tag `latest` todavia referencia.
      # El sintoma es un tag colgado: `docker pull ...:latest` falla con
      # "manifests/sha256:... not found" aunque el login a GHCR sea correcto.
      - name: Purgar versiones huerfanas de la imagen
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: frontend-proyecto-turnos
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

      - name: Disparar deploy en Coolify
        run: |
          # Sin -f: queremos VER el cuerpo de la respuesta cuando algo falla. Coolify explica
          # el motivo ahi (uuid inexistente, token sin permiso Deploy, metodo incorrecto).
          codigo=$(curl -sS -o /tmp/coolify.txt -w '%{http_code}' -X POST \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "HTTP $codigo"
          cat /tmp/coolify.txt; echo
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "::error::Coolify respondio $codigo. 401 = token invalido o sin permiso" \
                 "Deploy; 404 = uuid incorrecto; 405 = metodo equivocado (la API cambio a POST)."
            exit 1
          fi
